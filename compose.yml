name: zem
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zem}
      POSTGRES_USER: ${POSTGRES_USER:-zem}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]
  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-zem}
      POSTGRES_USER: ${POSTGRES_USER:-zem}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      ZEM_STORAGE: /data
      ZEM_PUBLIC_URL: ${WEB_ORIGIN:?Set WEB_ORIGIN}
      ZEM_ADMIN_EMAIL: ${ZEM_ADMIN_EMAIL:-}
      ZEM_ADMIN_PASSWORD: ${ZEM_ADMIN_PASSWORD:-}
    volumes: [documents:/data]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [internal]
  web:
    build: ./web
    restart: unless-stopped
    depends_on: [api]
    environment:
      API_INTERNAL_URL: http://api:8080
      WEB_ORIGIN: ${WEB_ORIGIN:?Set WEB_ORIGIN}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [internal]
  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    depends_on: [web, api]
    ports: ['127.0.0.1:8088:80']
    volumes: [./infra/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro]
    networks: [internal]
volumes:
  postgres:
  documents:
networks:
  internal:
