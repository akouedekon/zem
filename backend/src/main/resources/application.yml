spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/zem}
    username: ${POSTGRES_USER:zem}
    password: ${POSTGRES_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  servlet:
    multipart:
      max-file-size: 4MB
      max-request-size: 5MB
server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
zem:
  document-storage: ${ZEM_DOCUMENT_STORAGE:database}
  document-budget-bytes: ${ZEM_DOCUMENT_BUDGET_BYTES:157286400}
  storage: ${ZEM_STORAGE:./private-storage}
  public-url: ${ZEM_PUBLIC_URL:http://localhost:3000}
  bootstrap-email: ${ZEM_ADMIN_EMAIL:}
  bootstrap-password: ${ZEM_ADMIN_PASSWORD:}
