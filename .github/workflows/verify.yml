name: Verify MVP
on:
  push:
    branches: [main, feat/zem-mvp]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: zem-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17', cache: maven}
      - run: mvn -B verify
        working-directory: backend
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: backend-test-results, path: backend/target/surefire-reports, retention-days: 7}
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: web/package-lock.json}
      - run: npm ci && npm test && npm run typecheck && npm run build && npm audit --omit=dev --audit-level=high
        working-directory: web
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.44.0', channel: stable, cache: true}
      - run: flutter pub get && flutter analyze && flutter test && flutter build apk --debug --dart-define=API_BASE_URL=http://10.0.2.2:8088/api
        working-directory: mobile
      - uses: actions/upload-artifact@v4
        with: {name: zem-android-debug-emulator, path: mobile/build/app/outputs/flutter-apk/app-debug.apk, retention-days: 7}
      - name: Build pilot APK for Render
        run: flutter build apk --debug --dart-define=API_BASE_URL=https://zem-api-akx6.onrender.com/api
        working-directory: mobile
      - uses: actions/upload-artifact@v4
        with: {name: zem-android-pilot-render, path: mobile/build/app/outputs/flutter-apk/app-debug.apk, retention-days: 7}
  compose-e2e:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: CI-synthetic-database-password
      ZEM_ADMIN_EMAIL: admin@zem.test
      ZEM_ADMIN_PASSWORD: Admin-test-password-17
      WEB_ORIGIN: http://localhost:8088
      E2E_BASE_URL: http://localhost:8088
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: web/package-lock.json}
      - run: docker compose config -q && docker compose -f compose.yml -f compose.vps.yml config -q
      - run: docker compose up -d --build
      - name: Wait for API and web
        run: |
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://localhost:8088/api/health && curl --fail --silent http://localhost:8088/ > /dev/null; then exit 0; fi
            sleep 2
          done
          docker compose logs
          exit 1
      - run: docker compose exec -T nginx nginx -t
      - run: npm ci && npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: web
      - name: Focused local security probes
        run: node scripts/security-probes.mjs
        env:
          SECURITY_BASE_URL: http://localhost:8088
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: security-probe-results, path: security-results/local-probes.json, retention-days: 7}
      - name: Verify encrypted backup restoration in isolation
        run: |
          sudo apt-get update -qq && sudo apt-get install -y age
          mkdir -p work
          age-keygen -o work/restore-identity.txt
          export AGE_RECIPIENT=$(age-keygen -y work/restore-identity.txt)
          bash infra/backup.sh work/ci-backup.age
          AGE_IDENTITY=work/restore-identity.txt bash infra/restore-check.sh work/ci-backup.age
      - name: Check TLS configuration with a synthetic certificate
        run: |
          mkdir -p infra/tls
          openssl req -x509 -newkey rsa:2048 -nodes -keyout infra/tls/privkey.pem -out infra/tls/fullchain.pem -days 1 -subj /CN=zem.example
          docker compose -f compose.yml -f compose.vps.yml run --rm --no-deps nginx nginx -t
      - uses: actions/upload-artifact@v4
        if: failure()
        with: {name: browser-failure-traces, path: web/test-results, retention-days: 7}
      - run: docker compose logs --no-color && docker compose down
        if: always()
