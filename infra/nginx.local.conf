limit_req_zone $binary_remote_addr zone=zem_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=zem_api:10m rate=10r/s;
server {
    listen 80;
    server_name _;
    client_max_body_size 6m;
    server_tokens off;
    limit_req_status 429;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    location ~ ^/(api|bff)/auth/(login|register|register-passenger)$ {
        limit_req zone=zem_auth burst=5 nodelay;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        if ($uri ~ ^/api/) { proxy_pass http://api:8080; }
        if ($uri ~ ^/bff/) { proxy_pass http://web:3000; }
    }
    location /api/ {
        limit_req zone=zem_api burst=40 nodelay;
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location /bff/ {
        limit_req zone=zem_api burst=40 nodelay;
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location /verify/ {
        limit_req zone=zem_api burst=40 nodelay;
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
    }
    location / {
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
